[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackwater-mercenaries-hub-backend"
version = "0.10.0"
description = "FastAPI backend for the Blackwater Mercenaries Hub."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "alembic>=1.14,<2.0",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4.0",
]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
blackwater-dev = "app.cli.dev:main"
blackwater-seed = "app.cli.seed:main"
wosb-dev = "app.cli.dev:main"
wosb-seed = "app.cli.seed:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
