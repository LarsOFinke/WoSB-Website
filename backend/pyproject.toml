[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "royal-blackwater-fleet-backend"
version = "1.0.0"
description = "FastAPI backend for the Royal Blackwater Fleet."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "alembic>=1.14,<2.0",
  "cryptography>=48,<50",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4.0",
]
dev = [
  "pytest>=9,<10",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
  "playwright>=1.57,<2.0",
]

[project.scripts]
rbf-dev = "app.cli.dev:main"
rbf-seed = "app.cli.seed:main"
rbf-maintenance = "app.cli.maintenance_mode:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "error::DeprecationWarning:app\\.",
  "error::PendingDeprecationWarning:app\\.",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/app/modules/*/models/*.py" = ["F821"]
