# Maximum upload sizes and storage safeguards in MiB.
[upload_limits]
image_mb = 12
document_mb = 20
video_mb = 80
per_user_total_mb = 2048
global_total_mb = 20480
minimum_free_mb = 1024

# Periodic database cleanup.
[maintenance]
app_log_retention_days = 30
audit_log_retention_days = 365
interval_hours = 24
