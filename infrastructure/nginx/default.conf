limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_register:10m rate=4r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=public_pages:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
limit_req_status 429;

map $http_user_agent $rbf_blocked_crawler {
    default 0;
    ~*(GPTBot|ClaudeBot|CCBot|Bytespider|Amazonbot|meta-externalagent|Applebot-Extended) 1;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    access_log off;
    error_log /dev/stderr crit;
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    if ($rbf_blocked_crawler) {
        return 403;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    location = /gateway-health {
        access_log off;
        return 204;
    }

    location = /api/health {
        access_log off;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /api/health/ready {
        access_log off;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    access_log off;
    error_log /dev/stderr crit;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:RBFTLS:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 90m;

    if ($rbf_blocked_crawler) {
        return 403;
    }

    include /etc/nginx/snippets/rbf-security-headers.conf;
    error_page 503 /maintenance.html;

    location = /gateway-health {
        access_log off;
        return 204;
    }

    location = /maintenance.html {
        internal;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "120" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location = /api/health {
        access_log off;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/health/ready {
        access_log off;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/login {
        if (-f /run/rbf-control/status/maintenance-mode.json) { return 503; }
        limit_req zone=auth_login burst=5 nodelay;
        proxy_pass http://secure-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/logout {
        if (-f /run/rbf-control/status/maintenance-mode.json) { return 503; }
        limit_req zone=auth_login burst=10 nodelay;
        proxy_pass http://secure-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/change-password {
        if (-f /run/rbf-control/status/maintenance-mode.json) { return 503; }
        limit_req zone=auth_login burst=5 nodelay;
        proxy_pass http://secure-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/me {
        if (-f /run/rbf-control/status/maintenance-mode.json) { return 503; }
        proxy_pass http://secure-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/register {
        if (-f /run/rbf-control/status/maintenance-mode.json) { return 503; }
        limit_req zone=auth_register burst=2 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        if (-f /run/rbf-control/status/maintenance-mode.json) { return 503; }
        include /etc/nginx/snippets/rbf-security-headers.conf;
        limit_req zone=api_general burst=120 nodelay;
        limit_conn connections_per_ip 20;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        if (-f /run/rbf-control/status/maintenance-mode.json) { return 503; }
        include /etc/nginx/snippets/rbf-upload-security-headers.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        add_header Cache-Control "private, no-store" always;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/rbf-security-headers.conf;
        try_files /robots.txt =404;
        default_type text/plain;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~ ^/(admin|profile|calendar|squads|groups)(/|$) {
        if (-f /run/rbf-control/status/maintenance-mode.json) { return 503; }
        include /etc/nginx/snippets/rbf-security-headers.conf;
        limit_req zone=public_pages burst=40 nodelay;
        limit_conn connections_per_ip 12;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/rbf-security-headers.conf;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        if (-f /run/rbf-control/status/maintenance-mode.json) { return 503; }
        include /etc/nginx/snippets/rbf-security-headers.conf;
        limit_req zone=public_pages burst=40 nodelay;
        limit_conn connections_per_ip 12;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
