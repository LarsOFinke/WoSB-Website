# Project site imported through VPS-Gateway. Keep host edits and Certbot TLS
# changes in the installed copy when updating this template.
server {
    listen 80;
    listen [::]:80;
    server_name ${APP_HOSTNAME};
    access_log /var/log/nginx/access.log vps_gateway;

    limit_req zone=gateway_per_ip burst=60 nodelay;
    limit_req zone=gateway_per_site burst=100;
    limit_conn gateway_conn_per_ip 50;

    client_max_body_size ${GATEWAY_MAX_BODY_MB}m;

    location / {
        proxy_pass http://127.0.0.1:${RBF_LOOPBACK_PORT};
        include /etc/nginx/snippets/vps-gateway-proxy-headers.conf;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
