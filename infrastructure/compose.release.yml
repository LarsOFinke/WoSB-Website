x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16.14-alpine3.24
    logging: *default-logging
    restart: unless-stopped
    init: true
    pids_limit: 256
    env_file: ["${RBF_ENV_FILE:-.env}"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backend]
    security_opt: [no-new-privileges:true]

  api:
    image: ${RBF_API_IMAGE:-rbf-hub-api:local}
    logging: *default-logging
    build:
      context: ..
      dockerfile: infrastructure/docker/api-runtime.Dockerfile
    restart: unless-stopped
    init: true
    pids_limit: 384
    env_file: ["${RBF_ENV_FILE:-.env}"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      CONTROL_DIR: /var/lib/rbf/control
      ALLOWED_HOSTS: ${APP_HOSTNAME},${APP_IP},localhost,127.0.0.1
    volumes:
      - ./data/uploads:/var/lib/rbf/uploads
      - ./data/control:/var/lib/rbf/control
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8080"]
    networks: [backend, outbound]
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  gateway:
    image: ${RBF_GATEWAY_IMAGE:-rbf-hub-gateway:local}
    logging: *default-logging
    build:
      context: ..
      dockerfile: infrastructure/docker/gateway-runtime.Dockerfile
      args:
        GATEWAY_MAX_BODY_MB: ${GATEWAY_MAX_BODY_MB:-90}
    restart: unless-stopped
    init: true
    pids_limit: 128
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./data/certs:/etc/nginx/certs:ro
      - ./data/acme:/var/www/certbot:ro
      - ./data/nginx:/var/log/nginx
      - ./data/control/status:/run/rbf-control/status:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend, backend]
    group_add: ["10001"]
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/gateway-health >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  outbound:
    driver: bridge
