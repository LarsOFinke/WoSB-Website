x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16.14-alpine3.24
    logging: *default-logging
    restart: unless-stopped
    init: true
    pids_limit: 256
    env_file:
      - .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  migrate:
    image: ${RBF_API_IMAGE:-rbf-hub-api:local}
    logging: *default-logging
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      RBF_ENV_FILE: /app/config/container.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      - postgres
    restart: "no"
    init: true
    pids_limit: 128
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  seed:
    image: ${RBF_API_IMAGE:-rbf-hub-api:local}
    logging: *default-logging
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      RBF_ENV_FILE: /app/config/container.env
    command: ["sh", "-c", "AUTO_SEED=true rbf-seed"]
    volumes:
      - ./data/uploads:/data/uploads
    restart: "no"
    init: true
    pids_limit: 128
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: ${RBF_API_IMAGE:-rbf-hub-api:local}
    logging: *default-logging
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    pids_limit: 256
    env_file:
      - .env
    environment:
      RBF_ENV_FILE: /app/config/container.env
      CONTROL_REQUEST_DIR: /run/rbf-control/inbox
      CONTROL_STATUS_DIR: /run/rbf-control/status
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/control/inbox:/run/rbf-control/inbox
      - ./data/control/status:/run/rbf-control/status:ro
    depends_on:
      - postgres
    expose:
      - "8000"
    networks:
      - backend
      - outbound
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  secure-api:
    image: ${RBF_SECURE_API_IMAGE:-rbf-hub-secure-api:local}
    logging: *default-logging
    build:
      context: ../spring-api
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    pids_limit: 256
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS}
      FASTAPI_INTERNAL_URL: http://api:8000
      ALLOWED_HOSTS: ${APP_HOSTNAME},localhost,127.0.0.1
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  gateway:
    image: ${RBF_GATEWAY_IMAGE:-rbf-hub-gateway:local}
    logging: *default-logging
    build:
      context: ..
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_MONITORING_HTTPS_PORT: ${MONITORING_HTTPS_PORT:-8443}
        GATEWAY_MAX_BODY_MB: ${GATEWAY_MAX_BODY_MB:-90}
    restart: unless-stopped
    init: true
    pids_limit: 128
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./data/certs:/etc/nginx/certs:ro
      - ./data/acme:/var/www/certbot:ro
      - ./data/nginx:/var/log/nginx
      - ./data/control/status:/run/rbf-control/status:ro
    depends_on:
      - api
      - secure-api
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/gateway-health >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    logging: *default-logging
    restart: unless-stopped
    init: true
    pids_limit: 256
    profiles: ["monitoring"]
    volumes:
      - ./data/uptime-kuma:/app/data
    ports:
      - "127.0.0.1:${UPTIME_KUMA_LOCAL_PORT:-3001}:3001"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  monitoring-gateway:
    image: ${RBF_GATEWAY_IMAGE:-rbf-hub-gateway:local}
    logging: *default-logging
    restart: unless-stopped
    init: true
    pids_limit: 128
    profiles: ["monitoring"]
    ports:
      - "${MONITORING_HTTPS_PORT:-8443}:443"
    volumes:
      - ./data/certs:/etc/nginx/certs:ro
      - ./nginx/monitoring.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - uptime-kuma
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  outbound:
    driver: bridge
