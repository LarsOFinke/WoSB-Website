x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  migrate:
    image: ${RBV_API_IMAGE:-rbv-hub-api:local}
    logging: *default-logging
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      RBV_ENV_FILE: /app/config/container.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      - postgres
    restart: "no"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  seed:
    image: ${RBV_API_IMAGE:-rbv-hub-api:local}
    logging: *default-logging
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      RBV_ENV_FILE: /app/config/container.env
    command: ["sh", "-c", "if [ \"$$AUTO_SEED\" = \"true\" ]; then rbv-seed; else echo \"Seeding disabled.\"; fi"]
    restart: "no"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  api:
    image: ${RBV_API_IMAGE:-rbv-hub-api:local}
    logging: *default-logging
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RBV_ENV_FILE: /app/config/container.env
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      - postgres
    expose:
      - "8000"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  gateway:
    image: ${RBV_GATEWAY_IMAGE:-rbv-hub-gateway:local}
    logging: *default-logging
    build:
      context: ..
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./data/certs:/etc/nginx/certs:ro
      - ./data/acme:/var/www/certbot:ro
      - ./data/nginx:/var/log/nginx
    depends_on:
      - api
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true

  uptime-kuma:
    image: louislam/uptime-kuma:1
    logging: *default-logging
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./data/uptime-kuma:/app/data
    ports:
      - "127.0.0.1:${UPTIME_KUMA_LOCAL_PORT:-3001}:3001"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  monitoring-gateway:
    image: ${RBV_GATEWAY_IMAGE:-rbv-hub-gateway:local}
    logging: *default-logging
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "${MONITORING_HTTPS_PORT:-8443}:443"
    volumes:
      - ./data/certs:/etc/nginx/certs:ro
      - ./nginx/monitoring.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - uptime-kuma
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
