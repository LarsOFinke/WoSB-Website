name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.14-alpine3.24
        env:
          POSTGRES_USER: rbf_ci
          POSTGRES_PASSWORD: rbf_ci_password
          POSTGRES_DB: rbf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rbf_ci -d rbf_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - name: Install
        run: |
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend
      - name: Lint and isolated tests
        run: |
          cd backend && ruff check --no-cache src tests
          cd .. && python scripts/run_backend_tests.py
      - name: PostgreSQL migration lifecycle
        working-directory: backend
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          cat > "$tmp_dir/ci.env" <<ENV
          APP_ENV=staging
          DATABASE_URL=postgresql+psycopg://rbf_ci:rbf_ci_password@127.0.0.1:5432/rbf_ci
          DB_SCHEMA_MODE=migrate
          UPLOAD_DIR=$tmp_dir/uploads
          CONTROL_REQUEST_DIR=$tmp_dir/control/inbox
          CONTROL_STATUS_DIR=$tmp_dir/control/status
          CORS_ORIGINS=http://localhost
          SESSION_COOKIE_SECURE=false
          AUTO_SEED=false
          ENV
          RBF_ENV_FILE="$tmp_dir/ci.env" PYTHONPATH=src alembic upgrade head
          RBF_ENV_FILE="$tmp_dir/ci.env" PYTHONPATH=src alembic check
          RBF_ENV_FILE="$tmp_dir/ci.env" PYTHONPATH=src python -c "from app.db.init_db import verify_database_ready; verify_database_ready()"
          RBF_ENV_FILE="$tmp_dir/ci.env" PYTHONPATH=src alembic downgrade base
          RBF_ENV_FILE="$tmp_dir/ci.env" PYTHONPATH=src alembic upgrade head

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test and build
        working-directory: frontend
        run: |
          cp .env.example .env
          npm run test:ci

  repository:
    name: Repository and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Repository invariants
        run: python scripts/check_repository.py --strict-tree
      - name: Shell and Compose validation
        run: bash scripts/test-infrastructure.sh

  images:
    name: Production images
    if: github.event_name == 'push'
    needs: [backend, frontend, repository]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Compose environment
        run: cp infrastructure/.env.example infrastructure/.env
      - name: Build API and gateway
        working-directory: infrastructure
        run: docker compose -f compose.yml build api gateway
