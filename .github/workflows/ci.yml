name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.14-alpine3.24
        env:
          POSTGRES_USER: rbf_ci
          POSTGRES_PASSWORD: rbf_ci_password
          POSTGRES_DB: rbf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rbf_ci -d rbf_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend
      - name: Lint and isolated tests
        run: |
          cd backend && ruff check --no-cache src tests
          cd .. && python scripts/run_backend_tests.py
          python -m pytest -q -p no:cacheprovider tools/recovery-tool/tests tests/recovery
      - name: PostgreSQL migration lifecycle
        working-directory: backend
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          cat > "$tmp_dir/ci.env" <<ENV
          APP_ENV=staging
          DATABASE_URL=postgresql+psycopg://rbf_ci:rbf_ci_password@127.0.0.1:5432/rbf_ci
          DB_SCHEMA_MODE=migrate
          UPLOAD_DIR=$tmp_dir/uploads
          CONTROL_REQUEST_DIR=$tmp_dir/control/inbox
          CONTROL_STATUS_DIR=$tmp_dir/control/status
          CORS_ORIGINS=http://localhost
          SESSION_COOKIE_SECURE=false
          AUTO_SEED=false
          ENV
          RBF_ENV_FILE="$tmp_dir/ci.env" PYTHONPATH=src alembic upgrade head
          RBF_ENV_FILE="$tmp_dir/ci.env" PYTHONPATH=src alembic check
          RBF_ENV_FILE="$tmp_dir/ci.env" PYTHONPATH=src python -c "from app.db.init_db import verify_database_ready; verify_database_ready()"
          RBF_ENV_FILE="$tmp_dir/ci.env" PYTHONPATH=src alembic downgrade base
          RBF_ENV_FILE="$tmp_dir/ci.env" PYTHONPATH=src alembic upgrade head
      - name: Historical backup recovery matrix
        env:
          RECOVERY_MATRIX_DATABASE_URL: postgresql+psycopg://rbf_ci:rbf_ci_password@127.0.0.1:5432/rbf_ci
        run: python scripts/test_recovery_matrix.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test and build
        working-directory: frontend
        run: |
          cp .env.example .env
          npm run test:ci

  browser-smoke:
    name: Full-stack browser smoke
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install application and Chromium
        run: |
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend
          python -m playwright install --with-deps chromium
          cd frontend
          npm ci
          cp .env.example .env
      - name: Run full-stack browser smoke
        run: python scripts/run_browser_smoke.py

  repository:
    name: Repository and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install repository-check dependencies
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e backend
      - name: Repository invariants
        run: python scripts/check_repository.py --strict-tree
      - name: Security invariants
        run: python scripts/security_audit.py
      - name: CSS architecture audit
        run: python scripts/audit_css.py
      - name: Shell and Compose validation
        run: bash scripts/test-infrastructure.sh

  images:
    name: Production images
    if: github.event_name == 'push'
    needs: [backend, frontend, repository]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Prepare Compose environment
        run: cp infrastructure/.env.example infrastructure/.env
      - name: Build API and gateway
        working-directory: infrastructure
        run: docker compose -f compose.yml build api gateway
