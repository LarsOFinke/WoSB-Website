name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - name: Install
        run: |
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend
      - name: Lint and isolated tests
        run: |
          cd backend && ruff check --no-cache src tests
          cd .. && python scripts/run_backend_tests.py
      - name: Migration lifecycle
        working-directory: backend
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          cat > "$tmp_dir/ci.env" <<ENV
          APP_ENV=development
          DATABASE_URL=sqlite:///$tmp_dir/ci.db
          DB_SCHEMA_MODE=none
          UPLOAD_DIR=$tmp_dir/uploads
          CONTROL_DIR=$tmp_dir/control
          CORS_ORIGINS=http://localhost
          SESSION_COOKIE_SECURE=false
          AUTO_SEED=false
          ENV
          RBF_ENV_FILE="$tmp_dir/ci.env" PYTHONPATH=src alembic upgrade head
          RBF_ENV_FILE="$tmp_dir/ci.env" PYTHONPATH=src alembic check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Test and build
        working-directory: frontend
        run: |
          cp .env.example .env
          npm run test:ci

  repository:
    name: Repository and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Repository invariants
        run: python scripts/check_repository.py --strict-tree
      - name: Shell and Compose validation
        run: bash scripts/test-infrastructure.sh

  images:
    name: Production images
    if: github.event_name == 'push'
    needs: [backend, frontend, repository]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Compose environment
        run: cp infrastructure/.env.example infrastructure/.env
      - name: Build API and gateway
        working-directory: infrastructure
        run: docker compose -f compose.yml build api gateway
