name: CI
on:
  pull_request:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: "ci-${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13'}
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - run: cp frontend/.env.example frontend/.env
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: bash infrastructure/scripts/quality/validate.sh full

  release-images:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: mvn -f spring-api/pom.xml --batch-mode --no-transfer-progress -DskipTests package
      - run: cp frontend/.env.example frontend/.env && cd frontend && npm ci && npm run build
      - run: python infrastructure/scripts/release/package_deployment_artifact.py --version "$(cat VERSION)" --jar "$(find spring-api/target -name 'rbf-api-*.jar' ! -name '*.original' | head -1)" --frontend-dist frontend/dist --output-dir release --source-revision "$GITHUB_SHA"
      - name: Verify and build runtime images
        run: |
          mkdir extracted
          artifact="$(find release -name 'rbf-deployment-*.tar.gz' | head -1)"
          python infrastructure/scripts/release/verify-artifact.py "$artifact" extracted >/dev/null
          cp extracted/payload/infrastructure/.env.example extracted/payload/infrastructure/.env
          mkdir -p extracted/payload/infrastructure/data/{postgres,uploads,control,nginx,certs,acme}
          docker compose --env-file extracted/payload/infrastructure/.env -f extracted/payload/infrastructure/compose.release.yml build api gateway
