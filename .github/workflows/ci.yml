name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -e './backend[dev]'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate source and migrations
        run: bash ./scripts/validate.sh

      - name: Prepare Compose environment
        run: cp infrastructure/.env.example infrastructure/.env

      - name: Validate Compose model
        working-directory: infrastructure
        run: docker compose -f compose.yml config

      - name: Build production images
        working-directory: infrastructure
        run: docker compose -f compose.yml build api gateway
