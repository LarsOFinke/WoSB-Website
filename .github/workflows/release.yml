name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        default: 1.0.0

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend
          cd frontend && npm ci
      - name: Validate
        run: bash scripts/test.sh full
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$version" == "$(cat VERSION)" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package
        run: python scripts/package_release.py --version '${{ steps.version.outputs.version }}' --output-dir release
      - uses: actions/upload-artifact@v6
        with:
          name: royal-blackwater-fleet-${{ steps.version.outputs.version }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.sha256 \
            --title "Royal Blackwater Fleet $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
