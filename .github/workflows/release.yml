name: Release
on:
  push: {tags: ['v*']}
  workflow_dispatch:
permissions: {contents: write, id-token: write, attestations: write}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13'}
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Validate tag version
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - run: mvn -f spring-api/pom.xml --batch-mode --no-transfer-progress clean verify
      - run: cp frontend/.env.example frontend/.env && cd frontend && npm ci && npm run test:ci
      - run: bash infrastructure/scripts/quality/validate.sh
      - name: Package compiled release
        run: python infrastructure/scripts/release/package_deployment_artifact.py --version "$(cat VERSION)" --jar "$(find spring-api/target -name 'rbf-api-*.jar' ! -name '*.original' | head -1)" --frontend-dist frontend/dist --output-dir release --source-revision "$GITHUB_SHA"
      - run: python infrastructure/scripts/release/package_release.py --version "$(cat VERSION)" --output-dir release
      - name: Publish backup-server provisioner
        run: |
          cp tools/backup-server/provision-rbf-backup-server.sh release/
          (cd release && sha256sum provision-rbf-backup-server.sh > provision-rbf-backup-server.sh.sha256)
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with: {subject-path: 'release/rbf-deployment-*.tar.gz'}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with: {name: "rbf-${{ github.ref_name }}", path: 'release/*', if-no-files-found: error}
      - if: github.ref_type == 'tag'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Royal Blackwater Fleet $GITHUB_REF_NAME" --notes-file CHANGELOG.md
