name: Security
on:
  pull_request: {branches: [main]}
  merge_group: {types: [checks_requested]}
  push: {branches: [main]}
  schedule: [{cron: '17 4 * * *'}]
  workflow_dispatch:
permissions: {actions: read, contents: read, security-events: write}

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Resolve UTC dependency-cache key
        id: dependency-cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore OWASP Dependency-Check cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: odc-${{ runner.os }}-12.2.2-${{ steps.dependency-cache-date.outputs.date }}
          restore-keys: |
            odc-${{ runner.os }}-12.2.2-
      - name: Refresh dependency vulnerability cache
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          dependency_check_args=(-DnvdValidForHours=0)
          if [[ -n "$NVD_API_KEY" ]]; then
            dependency_check_args+=(-DnvdApiKeyEnvironmentVariable=NVD_API_KEY)
          fi
          mvn -f spring-api/pom.xml --batch-mode --no-transfer-progress \
            org.owasp:dependency-check-maven:12.2.2:update-only "${dependency_check_args[@]}"
      - name: Scan Spring dependencies
        run: |
          mvn -f spring-api/pom.xml --batch-mode --no-transfer-progress \
            org.owasp:dependency-check-maven:12.2.2:check \
            -DautoUpdate=false \
            -DfailBuildOnCVSS=7 \
            -DfailBuildOnUnusedSuppressionRule=true \
            -DsuppressionFile=spring-api/dependency-check-suppressions.xml
      - run: cd frontend && npm ci && npm audit --audit-level=high
      - run: python infrastructure/scripts/quality/security_audit.py

  container-images:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: mvn -f spring-api/pom.xml --batch-mode --no-transfer-progress -DskipTests package
      - run: cp frontend/.env.example frontend/.env && cd frontend && npm ci && npm run build
      - run: mkdir -p artifacts/frontend && cp "$(find spring-api/target -name 'rbf-api-*.jar' ! -name '*.original' | head -1)" artifacts/rbf-api.jar && cp -a frontend/dist/. artifacts/frontend/
      - run: cp infrastructure/.env.example infrastructure/.env && docker compose --env-file infrastructure/.env -f infrastructure/compose.release.yml build api gateway
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with: {image-ref: 'rbf-hub-api:local', format: table, exit-code: '1', ignore-unfixed: true, severity: 'HIGH,CRITICAL'}
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with: {image-ref: 'rbf-hub-gateway:local', format: table, exit-code: '1', ignore-unfixed: true, severity: 'HIGH,CRITICAL'}
