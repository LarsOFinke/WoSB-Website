name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Raspberry Pi production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.RBF_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.RBF_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/rbf_deploy
          chmod 600 ~/.ssh/rbf_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Update production
        env:
          HOST: ${{ secrets.RBF_DEPLOY_HOST }}
          PORT: ${{ secrets.RBF_DEPLOY_PORT }}
          USER: ${{ secrets.RBF_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.RBF_DEPLOY_PATH }}
        run: |
          port="${PORT:-22}"
          printf -v remote 'cd %q && sudo ./update.sh --seed' "$DEPLOY_PATH"
          ssh -i ~/.ssh/rbf_deploy -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER@$HOST" "$remote"
